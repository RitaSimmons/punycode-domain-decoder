[project]
name = "punycode-domain-decoder"
version = "0.1.1"
description = "Decodes internationalized domain names from ACE to Unicode, handling label boundaries and invalid input."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
